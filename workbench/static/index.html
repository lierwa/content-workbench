<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>候选工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true">选</span><div><strong>候选工作台</strong><span>从热点到一篇可确认的稿件</span></div></div>
    <div class="header-actions"><span id="schedule-status" class="schedule"><span class="status-dot"></span>定时状态读取中</span><button id="collect" class="button button-primary" type="button"><span aria-hidden="true">＋</span> 手动采集</button></div>
  </header>
  <main class="workspace">
    <section class="list-pane" aria-labelledby="list-heading">
      <div class="section-head"><div><p class="eyebrow">01 / 今日选题</p><h1 id="list-heading">候选列表 <span id="total-count" class="count">—</span></h1></div><button id="refresh" class="text-button" type="button">刷新列表 <span aria-hidden="true">↻</span></button></div>
      <div class="introduction">浏览标题，勾选值得继续看的素材。选中后再获取详情、编辑稿件。</div>
      <div id="collection-result" class="collection-result" hidden aria-live="polite"></div>
      <div class="filters">
        <label class="search-label"><span class="sr-only">搜索候选标题</span><span aria-hidden="true" class="search-icon">⌕</span><input id="search" type="search" placeholder="搜索标题或关键词"></label>
        <label class="source-label"><span class="sr-only">按来源筛选</span><select id="source"><option value="">全部来源</option></select></label>
      </div>
      <nav class="tabs" aria-label="候选状态筛选">
        <button type="button" class="tab is-active" data-filter="pending" aria-pressed="true">待选</button><button type="button" class="tab" data-filter="selected" aria-pressed="false">已选</button><button type="button" class="tab" data-filter="deferred" aria-pressed="false">待定</button><button type="button" class="tab" data-filter="excluded" aria-pressed="false">已排除</button><button type="button" class="tab" data-filter="" aria-pressed="false">全部</button>
      </nav>
      <div class="batch-bar"><label class="select-all"><input id="select-all" type="checkbox"> 本页全选</label><span id="checked-count" class="checked-count">已勾选 0 项</span><div class="batch-actions"><button data-selection="selected" type="button" disabled>采用</button><button data-selection="deferred" type="button" disabled>待定</button><button data-selection="excluded" type="button" disabled>排除</button></div></div>
      <div id="list-status" class="inline-status" role="status">正在读取候选…</div>
      <div id="candidate-list" class="candidate-list"></div>
      <div class="pagination"><span id="page-info">—</span><div><button id="previous" class="icon-button" type="button" aria-label="上一页" disabled>←</button><button id="next" class="icon-button" type="button" aria-label="下一页" disabled>→</button></div></div>
      <p class="history-note"><span aria-hidden="true">↳</span> 历史内容：入口待接入</p>
    </section>
    <aside class="detail-pane" aria-labelledby="detail-heading">
      <div class="detail-empty" id="detail-empty"><div class="empty-mark" aria-hidden="true">✳</div><p class="eyebrow">02 / 内容整理</p><h2 id="detail-heading">打开一条候选</h2><p>从左侧列表选择一条，查看来源并准备稿件。</p><span class="empty-rule"></span><small>选择素材后，仍需编辑并确认稿件。</small></div>
      <div id="detail-content" hidden></div>
    </aside>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
